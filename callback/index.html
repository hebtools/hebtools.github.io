<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorización de TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}
textarea{width:100%;height:120px;font-family:monospace;font-size:13px}button{font-size:16px;padding:10px 18px;margin-top:10px;cursor:pointer}</style>
</head><body>
<h1 id="titulo">Autorización recibida</h1>
<p id="texto">Copia esta dirección completa y pégala en la ventana del bot (donde pone «&gt;»):</p>
<textarea id="url" readonly></textarea><br>
<button id="copiar">Copiar</button> <span id="ok"></span>
<script>
var u = window.location.href, q = new URLSearchParams(window.location.search);
document.getElementById("url").value = u;
if (!q.get("code")) {
  document.getElementById("titulo").textContent = "No ha llegado ningún código";
  document.getElementById("texto").textContent = "TikTok no ha devuelto autorización. " + (q.get("error_description") || q.get("error") || "Vuelve a abrir 5-autorizar-tiktok.bat");
}
document.getElementById("copiar").onclick = function () {
  var t = document.getElementById("url"); t.select();
  try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); }
  document.getElementById("ok").textContent = "Copiado";
};
</script>
</body></html>
